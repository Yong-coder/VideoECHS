<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Looping MP4 Player</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      box-sizing: border-box;
      background: #f4f6f8;
      color: #222;
      font-family: Arial, sans-serif;
    }
    main { width: min(900px, 100%); }
    h1 { margin: 0 0 16px; font-size: 1.5rem; }
    video {
      display: block;
      width: 100%;
      max-height: 75vh;
      background: #000;
      border-radius: 8px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    input[type="url"] {
      flex: 1 1 260px;
      min-width: 0;
      padding: 10px;
      border: 1px solid #c9cdd3;
      border-radius: 6px;
      font: inherit;
    }
    input[type="file"] { max-width: 100%; }
    button, .file-label {
      padding: 10px 14px;
      border: 0;
      border-radius: 6px;
      background: #1769e0;
      color: white;
      font: inherit;
      cursor: pointer;
    }
    .file-label { display: inline-block; }
    .hint { color: #5b6572; font-size: .9rem; margin-top: 10px; }
    #message { min-height: 1.2em; color: #a12626; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>MP4 Video Player</h1>
    <video id="player" controls loop playsinline>
      Your browser does not support HTML video.
    </video>

    <div class="controls">
      <label class="file-label" for="fileInput">Choose video</label>
      <input id="fileInput" type="file" accept="video/mp4,video/*" hidden>
      <input id="videoUrl" type="url" placeholder="Paste a direct MP4 video URL">
      <button id="loadUrl" type="button">Load URL</button>
    </div>
    <p class="hint">Loop is enabled, so the video repeats automatically when it reaches the end.</p>
    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script>
    const player = document.getElementById('player');
    const fileInput = document.getElementById('fileInput');
    const videoUrl = document.getElementById('videoUrl');
    const message = document.getElementById('message');
    let currentObjectUrl = null;

    // Keep looping enabled even when a new video is loaded.
    player.loop = true;

    function loadVideo(source, objectUrl = false) {
      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }
      if (objectUrl) currentObjectUrl = source;
      player.loop = true;
      player.src = source;
      player.load();
      message.textContent = '';
    }

    fileInput.addEventListener('change', () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      if (!file.type.startsWith('video/')) {
        message.textContent = 'Please choose a video file.';
        return;
      }
      videoUrl.value = '';
      loadVideo(URL.createObjectURL(file), true);
    });

    document.getElementById('loadUrl').addEventListener('click', () => {
      const value = videoUrl.value.trim();
      if (!value) {
        message.textContent = 'Paste a direct video URL first.';
        return;
      }
      try {
        const url = new URL(value);
        if (!['http:', 'https:'].includes(url.protocol)) throw new Error();
        fileInput.value = '';
        loadVideo(url.href);
      } catch {
        message.textContent = 'Enter a valid http:// or https:// video URL.';
      }
    });

    player.addEventListener('error', () => {
      if (player.currentSrc) {
        message.textContent = 'Unable to play this source. Use a direct video link or choose a local video file.';
      }
    });

    window.addEventListener('beforeunload', () => {
      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
    });
  </script>
</body>
</html>
